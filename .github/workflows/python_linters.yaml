---

name: python_linters
"on":
  - pull_request
  - push

jobs:
  flake8:
    name: Python Lint - flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install flake8
        run: python -m pip install --upgrade pip flake8
      - name: Run flake8
        run: flake8 transforms/

  black:
    name: Python Lint - black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Black
        run: python -m pip install --upgrade pip black
      - name: Run black --check .
        run: black --check transforms/.
